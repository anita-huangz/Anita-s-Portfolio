[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piano-arranger"
version = "0.1.0"
description = "Turns a chord chart into a playable piano arrangement by solving for voicings, with an optional language-model layer for intent."
requires-python = ">=3.11"
# No runtime dependencies on purpose. The whole engine is integer arithmetic
# over pitch classes and a dynamic program over a few thousand states; pulling
# in a music library would hide exactly the part worth showing, and the MIDI
# writer is 80 lines of `struct.pack`.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.7"]
# The language-model layer is optional in the packaging as well as at runtime.
llm = ["httpx>=0.27"]

[project.scripts]
arrange = "arranger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# Branch coverage, with a floor CI enforces. The floor sits a couple of points
# under what the suite measures today: it is a ratchet against silent rot, not
# a target to game. Raise it when the suite earns it.
[tool.coverage.run]
source = ["arranger"]
branch = true

[tool.coverage.report]
fail_under = 94
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
