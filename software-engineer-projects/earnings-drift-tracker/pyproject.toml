[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earnings-drift"
version = "0.2.0"
description = "Measures post-earnings-announcement drift against analyst surprise."
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "numpy>=1.24", "requests>=2.31", "yfinance>=0.2"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=8", "ruff>=0.7", "matplotlib>=3.7"]

[project.scripts]
earnings-drift = "earnings_drift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
