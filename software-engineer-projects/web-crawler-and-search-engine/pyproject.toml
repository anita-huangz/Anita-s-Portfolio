[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trie-search"
version = "0.2.0"
description = "A trie-backed search index built by crawling a website."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "lxml>=5.0", "rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]

[project.scripts]
trie-search = "trie_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
