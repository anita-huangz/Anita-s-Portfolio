[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filing-intel"
version = "0.1.0"
description = "An MCP-served, telemetry-instrumented multi-agent research platform over SEC EDGAR filings."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "redis>=5.0",
    "httpx>=0.27",
    "mcp>=1.2",
    "langgraph>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7"]

[project.scripts]
filing-intel-mcp = "filing_intel.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# "." puts the project root on sys.path so tests/test_evals.py can import the
# `evals` package. Relying on pytest's implicit rootdir insertion worked
# locally and failed in CI, because which directory pytest prepends depends on
# the pytest version and the invocation directory.
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:filing_intel.*"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
