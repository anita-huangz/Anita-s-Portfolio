name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.project }} / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        project:
          - ai-platform-projects/sec-filing-intelligence
          - software-engineer-projects/earnings-drift-tracker
          - software-engineer-projects/factor-based-portfolio-simulator
          - software-engineer-projects/card-game-system
          - software-engineer-projects/course-catalog-scheduling-system
          - software-engineer-projects/performance-optimization
          - software-engineer-projects/web-crawler-and-search-engine
          # The only data-science project that is a tested package.
          - data-science-projects/customer-churn-prediction
          - data-science-projects/bitcoin-and-asset-trading
          - data-science-projects/fake-news-detection
          - data-science-projects/global-security-threats
          - data-science-projects/personalized-recommendations-for-e-commerce
          - data-science-projects/weather-trends-and-forecast
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        # Every suite runs offline: no network, no API keys. The AI platform
        # uses its replay provider and fake data clients; the two quantitative
        # projects run on synthetic price paths.
        run: pytest -q

  site:
    name: portfolio site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm run build

  web:
    name: web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-platform-projects/sec-filing-intelligence/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ai-platform-projects/sec-filing-intelligence/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc -b --noEmit

      - name: Build
        run: npm run build

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the AI platform image
        run: docker build -t filing-intel:ci ai-platform-projects/sec-filing-intelligence
