[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "card-game"
version = "0.2.0"
description = "A single-player poker-style draw game with a scored hand evaluator."
requires-python = ">=3.11"
dependencies = ["rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.7"]

[project.scripts]
card-game = "card_game.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# Branch coverage, with a floor CI enforces. The floor sits a couple of points
# under what the suite measures today: it is a ratchet against silent rot, not
# a target to game. Raise it when the suite earns it.
[tool.coverage.run]
source = ["card_game"]
branch = true

[tool.coverage.report]
fail_under = 97
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
