[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-trend"
version = "0.1.0"
description = "Warming trends with uncertainty that accounts for serial correlation."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.0", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7", "statsmodels>=0.14"]

[project.scripts]
climate-trend = "climate_trend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
climate_trend = ["data/*.csv"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
